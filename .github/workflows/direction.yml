# Static checks for the /taste conductor skill on every pull request and on main.
name: direction

on:
  pull_request:
    paths: ["direction/**", ".github/workflows/direction.yml"]
  push:
    branches: [main]
    paths: ["direction/**", ".github/workflows/direction.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: direction
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static skill checks
        run: node --test tests/test_skill.mjs
