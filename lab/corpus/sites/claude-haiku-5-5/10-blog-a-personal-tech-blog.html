<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byte & Beyond — A Personal Tech Blog</title>
  <meta name="description" content="Notes on software, systems, and the tools that shape how we build.">
  <style>
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #e8efff;
      --border: #e5e7eb;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --radius: 10px;
      --max: 720px;
      --font-body: "Charter", "Georgia", "Iowan Old Style", serif;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117;
        --surface: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-soft: #1b2a44;
        --border: #30363d;
        --code-bg: #010409;
        --code-text: #c9d1d9;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-soft: #1b2a44;
      --border: #30363d;
      --code-bg: #010409;
      --code-text: #c9d1d9;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header.site {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      font-family: var(--font-ui);
    }

    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .brand:hover { text-decoration: none; }
    .brand span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 0.95rem;
    }
    .nav-links a { color: var(--muted); }
    .nav-links a:hover { color: var(--text); text-decoration: none; }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 12px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 0.85rem;
    }
    .theme-toggle:hover { color: var(--text); }

    /* Hero */
    .hero {
      padding: 72px 0 40px;
      font-family: var(--font-ui);
    }
    .hero h1 {
      font-family: var(--font-body);
      font-size: 2.6rem;
      line-height: 1.2;
      margin: 0 0 14px;
      letter-spacing: -0.02em;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.1rem;
      margin: 0;
      max-width: 560px;
    }

    /* Search & tags */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 28px;
      font-family: var(--font-ui);
    }
    .search {
      flex: 1 1 240px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      font-family: var(--font-ui);
    }
    .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      font-family: var(--font-ui);
      font-size: 0.8rem;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .tag:hover { color: var(--text); }
    .tag.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Post list */
    .post-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 16px;
    }
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 26px;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      cursor: pointer;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
      border-color: var(--accent);
    }
    .post-meta {
      font-family: var(--font-ui);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .post-card h2 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .post-card p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .empty {
      font-family: var(--font-ui);
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
    }

    /* Article view */
    .article {
      padding: 56px 0 80px;
    }
    .back {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: var(--muted);
      display: inline-block;
      margin-bottom: 28px;
    }
    .article h1 {
      font-size: 2.6rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 8px 0 14px;
    }
    .article .byline {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .article-body h2 { font-size: 1.6rem; margin: 2.2em 0 .6em; letter-spacing: -0.01em; }
    .article-body h3 { font-size: 1.25rem; margin: 1.8em 0 .5em; }
    .article-body p { margin: 0 0 1.2em; }
    .article-body ul, .article-body ol { margin: 0 0 1.2em 1.4em; }
    .article-body li { margin-bottom: .4em; }
    .article-body blockquote {
      margin: 1.6em 0;
      padding: 4px 18px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      font-style: italic;
    }
    .article-body code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--accent-soft);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .article-body pre {
      background: var(--code-bg);
      color: var(--code-text);
      padding: 18px 20px;
      border-radius: var(--radius);
      overflow-x: auto;
      font-size: 0.88rem;
      line-height: 1.55;
      margin: 1.6em 0;
    }
    .article-body pre code {
      background: none;
      padding: 0;
      color: inherit;
      font-size: inherit;
    }
    .article-body img { max-width: 100%; border-radius: var(--radius); }
    .article-footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* Footer */
    footer.site {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    footer.site a { color: var(--muted); margin: 0 8px; }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      body { font-size: 17px; }
      .hero h1, .article h1 { font-size: 2rem; }
      .nav-links a.hide-sm { display: none; }
    }
  </style>
</head>
<body>

  <header class="site">
    <div class="wrap nav">
      <a href="#/" class="brand">byte<span>&</span>beyond</a>
      <nav class="nav-links">
        <a href="#/" class="hide-sm">Posts</a>
        <a href="#/about" class="hide-sm">About</a>
        <a href="#/tags" class="hide-sm">Tags</a>
        <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">Theme</button>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="site">
    <div class="wrap">
      © <span id="year"></span> Byte &amp; Beyond ·
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:hello@example.com">Email</a>
      <a href="#/">Home</a>
    </div>
  </footer>

<script>
  // ---------- Content ----------
  // Edit posts here. `body` accepts simple HTML.
  const POSTS = [
    {
      id: "rust-after-two-years",
      title: "Two Years of Rust: What Actually Stuck",
      date: "2026-10-28",
      tags: ["rust", "programming"],
      excerpt: "The borrow checker stopped feeling like an adversary somewhere around month five. Here's what I learned the hard way.",
      body: `
        <p>When I started writing Rust professionally, I expected the hardest part to be the syntax. It wasn't. It was learning to stop fighting ownership and start designing around it.</p>
        <h2>The borrow checker is a design reviewer</h2>
        <p>Most of the friction I hit came from trying to share mutable state across structures that really wanted to be a single owner. Once I reframed my data as a tree with clear ownership, most of the "fights" disappeared.</p>
        <blockquote>If you keep reaching for <code>Rc&lt;RefCell&lt;T&gt;&gt;</code>, your data model is probably asking for a rethink.</blockquote>
        <h2>Errors are values, and that's a feature</h2>
        <p>Using <code>Result</code> everywhere sounds verbose until you realize every failure path is visible in the signature. I now use <code>thiserror</code> for libraries and <code>anyhow</code> at the application boundary.</p>
        <pre><code>#[derive(Debug, thiserror::Error)]
enum ConfigError {
    #[error("missing key: {0}")]
    MissingKey(String),
    #[error("io failed")]
    Io(#[from] std::io::Error),
}</code></pre>
        <h2>What I'd tell my past self</h2>
        <ul>
          <li>Read other people's crates. The idioms are in the source.</li>
          <li>Don't optimize until <code>cargo flamegraph</code> tells you to.</li>
          <li>Clippy is a teacher. Let it teach you.</li>
        </ul>
      `
    },
    {
      id: "boring-infrastructure",
      title: "Boring Infrastructure Is a Superpower",
      date: "2026-09-14",
      tags: ["devops", "opinion"],
      excerpt: "Why I keep choosing the dull option, and how it's saved me more nights than any clever architecture.",
      body: `
        <p>Every few months, someone shows me a beautiful new system with five moving parts I've never heard of. I nod, admire it, and then go back to my boring Postgres box and a single deployment script.</p>
        <h2>Boring means well-understood</h2>
        <p>A tool that's been around for fifteen years has known failure modes, documented fixes, and people who've already debugged its worst edge cases at 3 a.m. That knowledge is worth more than any feature list.</p>
        <h2>Where I draw the line</h2>
        <p>Boring doesn't mean stagnant. I'll adopt new tools when they solve a real, measured problem I actually have, not a hypothetical one I'm afraid of.</p>
        <ol>
          <li>Does it solve a current problem?</li>
          <li>Can I operate it without a specialist?</li>
          <li>Can I leave it if I need to?</li>
        </ol>
      `
    },
    {
      id: "terminal-setup-2026",
      title: "My Terminal Setup, Trimmed Down",
      date: "2026-07-03",
      tags: ["tools", "productivity"],
      excerpt: "I deleted half my dotfiles this year. The result is faster, quieter, and easier to reason about.",
      body: `
        <p>For years my shell startup took nearly two seconds. I'd accumulated plugins, aliases, and prompt themes the way some people accumulate browser tabs. This year I went through and removed anything I didn't use weekly.</p>
        <h2>What stayed</h2>
        <ul>
          <li>A minimal prompt that shows git branch and exit status.</li>
          <li><code>fzf</code> for history and file search.</li>
          <li><code>tmux</code> with a short, memorable config.</li>
        </ul>
        <h2>Measuring startup</h2>
        <pre><code>for i in $(seq 1 10); do /usr/bin/time zsh -i -c exit; done</code></pre>
        <p>Startup dropped from about 1.9 seconds to around 180 milliseconds. Nothing I removed was missed.</p>
      `
    }
  ];

  const ABOUT_HTML = `
    <article class="article">
      <a href="#/" class="back">← Back to posts</a>
      <h1>About</h1>
      <div class="article-body">
        <p>Hi, I'm a software engineer who likes systems that are simple to reason about and tools that get out of the way.</p>
        <p>This blog is where I write down what I'm learning: languages, infrastructure, developer tools, and the occasional strong opinion. If something here helped you, or you think I'm wrong, I'd genuinely like to hear about it.</p>
        <h2>Elsewhere</h2>
        <ul>
          <li><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></li>
          <li><a href="mailto:hello@example.com">Email</a></li>
        </ul>
      </div>
    </article>`;

  // ---------- Helpers ----------
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  const readTime = html => Math.max(1, Math.round(html.replace(/<[^>]+>/g, " ").trim().split(/\s+/).length / 220));

  let activeTag = null;
  let query = "";

  // ---------- Views ----------
  function renderList() {
    const allTags = [...new Set(POSTS.flatMap(p => p.tags))].sort();
    const posts = POSTS
      .filter(p => !activeTag || p.tags.includes(activeTag))
      .filter(p => {
        if (!query) return true;
        const q = query.toLowerCase();
        return p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q);
      })
      .sort((a, b) => b.date.localeCompare(a.date));

    app.innerHTML = `
      <section class="hero">
        <h1>Notes from the keyboard.</h1>
        <p>Essays and TILs on software, systems, and the tools I can't stop tinkering with.</p>
      </section>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search posts…" value="${esc(query)}" aria-label="Search posts">
        <div class="tags" role="group" aria-label="Filter by tag">
          ${allTags.map(t => `<button class="tag ${t === activeTag ? "active" : ""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
        </div>
      </div>

      ${posts.length ? `
      <ul class="post-list">
        ${posts.map(p => `
          <li class="post-card" data-id="${esc(p.id)}" tabindex="0" role="link">
            <div class="post-meta">
              <span>${fmtDate(p.date)}</span>
              <span>${readTime(p.body)} min read</span>
            </div>
            <h2>${esc(p.title)}</h2>
            <p>${esc(p.excerpt)}</p>
          </li>`).join("")}
      </ul>` : `<p class="empty">No posts match that search.</p>`}
    `;

    document.getElementById("search").addEventListener("input", e => {
      query = e.target.value;
      renderList();
      document.getElementById("search").focus();
      document.getElementById("search").setSelectionRange(query.length, query.length);
    });

    app.querySelectorAll(".tag").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTag = activeTag === btn.dataset.tag ? null : btn.dataset.tag;
        renderList();
      });
    });

    app.querySelectorAll(".post-card").forEach(card => {
      const go = () => { location.hash = "#/post/" + card.dataset.id; };
      card.addEventListener("click", go);
      card.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    });
  }

  function renderPost(id) {
    const post = POSTS.find(p => p.id === id);
    if (!post) return render404();
    const idx = POSTS.indexOf(post);
    const prev = POSTS[idx + 1];
    const next = POSTS[idx - 1];

    app.innerHTML = `
      <article class="article">
        <a href="#/" class="back">← Back to posts</a>
        <div class="post-meta">
          <span>${fmtDate(post.date)}</span>
          <span>${readTime(post.body)} min read</span>
          ${post.tags.map(t => `<span>#${esc(t)}</span>`).join("")}
        </div>
        <h1>${esc(post.title)}</h1>
        <div class="byline">By the author · ${esc(post.excerpt)}</div>
        <div class="article-body">${post.body}</div>
        <footer class="article-footer">
          <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
            ${prev ? `<a href="#/post/${prev.id}">← ${esc(prev.title)}</a>` : "<span></span>"}
            ${next ? `<a href="#/post/${next.id}" style="text-align:right">${esc(next.title)} →</a>` : "<span></span>"}
          </div>
        </footer>
      </article>`;
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function renderAbout() {
    app.innerHTML = ABOUT_HTML;
  }

  function renderTags() {
    const map = {};
    POSTS.forEach(p => p.tags.forEach(t => (map[t] ||= []).push(p)));
    app.innerHTML = `
      <article class="article">
        <a href="#/" class="back">← Back to posts</a>
        <h1>Tags</h1>
        <div class="article-body">
          ${Object.keys(map).sort().map(t => `
            <h2>#${esc(t)}</h2>
            <ul>${map[t].map(p => `<li><a href="#/post/${p.id}">${esc(p.title)}</a></li>`).join("")}</ul>
          `).join("")}
        </div>
      </article>`;
  }

  function render404() {
    app.innerHTML = `
      <article class="article">
        <a href="#/" class="back">← Back to posts</a>
        <h1>Page not found</h1>
        <p class="empty">That post doesn't exist (yet).</p>
      </article>`;
  }

  // ---------- Router ----------
  function route() {
    const hash = location.hash.replace(/^#/, "") || "/";
    const parts = hash.split("/").filter(Boolean);

    if (parts.length === 0) {
      activeTag = null;
      renderList();
    } else if (parts[0] === "post" && parts[1]) {
      renderPost(parts[1]);
    } else if (parts[0] === "about") {
      renderAbout();
    } else if (parts[0] === "tags") {
      renderTags();
    } else {
      render404();
    }
    document.title = document.title.split(" — ")[0].replace(/ · .*/, "") + (parts[0] === "post" ? "" : "");
  }

  // ---------- Theme ----------
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if (saved) root.setAttribute("data-theme", saved);

  document.getElementById("themeToggle").addEventListener("click", () => {
    const current = root.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
