<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Finance Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --income: #22c55e;
    --expense: #ef4444;
    --warn: #f59e0b;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-2);
  }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 0.875rem; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  select, input, button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-2);
    border-radius: 8px;
    padding: 8px 12px;
  }
  button { cursor: pointer; background: var(--accent); color: #0f172a; border: none; font-weight: 600; }
  button.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--panel-2); }
  button:hover { filter: brightness(1.1); }

  main { padding: 24px 28px; display: grid; gap: 20px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 18px 20px;
    border: 1px solid var(--panel-2);
  }
  .card .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .card .value { font-size: 1.7rem; font-weight: 700; margin-top: 4px; }
  .card .delta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .pos { color: var(--income); }
  .neg { color: var(--expense); }

  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 20px;
    border: 1px solid var(--panel-2);
    min-width: 0;
  }
  .panel h2 { font-size: 1rem; margin-bottom: 14px; font-weight: 600; }

  .chart-wrap { position: relative; height: 260px; }
  canvas { width: 100%; height: 100%; display: block; }

  .legend { display: flex; gap: 16px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 2px; margin-right: 6px; vertical-align: middle;
  }
  .legend .inc::before { background: var(--income); }
  .legend .exp::before { background: var(--expense); }

  .bars .row { margin-bottom: 12px; }
  .bars .row-head { display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 4px; }
  .bars .track { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bars .fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
  .bars .fill.over { background: var(--expense); }

  .budget-row { margin-bottom: 14px; }
  .budget-row .head { display: flex; justify-content: space-between; font-size: 0.875rem; }
  .budget-row .muted { color: var(--muted); font-size: 0.8rem; }

  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--panel-2); }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); font-size: 0.75rem;
  }
  .table-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .table-controls input { flex: 1; min-width: 180px; }
  .table-wrap { overflow-x: auto; }
  .icon-btn { background: none; border: none; color: var(--expense); padding: 4px 8px; font-weight: 400; }

  form.add { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }
  form.add label { font-size: 0.75rem; color: var(--muted); display: grid; gap: 4px; }
  form.add input, form.add select { width: 100%; }
  form.add button { grid-column: 1 / -1; }

  .empty { color: var(--muted); text-align: center; padding: 24px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Personal Finance Dashboard</h1>
    <div class="sub" id="periodLabel"></div>
  </div>
  <div class="controls">
    <select id="monthSelect" aria-label="Month"></select>
    <button class="ghost" id="exportBtn">Export CSV</button>
    <button class="ghost" id="resetBtn">Reset Demo Data</button>
  </div>
</header>

<main>
  <section class="cards">
    <div class="card">
      <div class="label">Net Balance</div>
      <div class="value" id="netBalance">$0</div>
      <div class="delta" id="netDelta"></div>
    </div>
    <div class="card">
      <div class="label">Income</div>
      <div class="value pos" id="incomeTotal">$0</div>
      <div class="delta" id="incomeDelta"></div>
    </div>
    <div class="card">
      <div class="label">Expenses</div>
      <div class="value neg" id="expenseTotal">$0</div>
      <div class="delta" id="expenseDelta"></div>
    </div>
    <div class="card">
      <div class="label">Savings Rate</div>
      <div class="value" id="savingsRate">0%</div>
      <div class="delta" id="savingsDelta"></div>
    </div>
  </section>

  <section class="grid-2">
    <div class="panel">
      <h2>Income vs Expenses (last 6 months)</h2>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      <div class="legend"><span class="inc">Income</span><span class="exp">Expenses</span></div>
    </div>
    <div class="panel">
      <h2>Spending by Category</h2>
      <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
      <div id="categoryLegend" class="legend" style="flex-wrap:wrap;margin-top:12px"></div>
    </div>
  </section>

  <section class="grid-2">
    <div class="panel">
      <h2>Budgets</h2>
      <div id="budgets"></div>
    </div>
    <div class="panel">
      <h2>Add Transaction</h2>
      <form class="add" id="addForm">
        <label>Date
          <input type="date" name="date" required>
        </label>
        <label>Description
          <input type="text" name="description" placeholder="e.g. Groceries" required>
        </label>
        <label>Category
          <select name="category" id="categorySelect"></select>
        </label>
        <label>Type
          <select name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
        <label>Amount
          <input type="number" name="amount" step="0.01" min="0.01" required>
        </label>
        <button type="submit">Add Transaction</button>
      </form>
    </div>
  </section>

  <section class="panel">
    <h2>Transactions</h2>
    <div class="table-controls">
      <input type="search" id="searchInput" placeholder="Search description or category...">
      <select id="typeFilter">
        <option value="all">All types</option>
        <option value="income">Income</option>
        <option value="expense">Expenses</option>
      </select>
      <select id="sortSelect">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="amount-desc">Largest amount</option>
        <option value="amount-asc">Smallest amount</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th class="num">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
      <div id="txEmpty" class="empty" hidden>No transactions match your filters.</div>
    </div>
  </section>
</main>

<script>
(() => {
  const STORAGE_KEY = "finance-dashboard-v1";
  const CATEGORIES = [
    { name: "Housing", color: "#38bdf8" },
    { name: "Food", color: "#22c55e" },
    { name: "Transport", color: "#f59e0b" },
    { name: "Utilities", color: "#a78bfa" },
    { name: "Entertainment", color: "#f472b6" },
    { name: "Health", color: "#fb7185" },
    { name: "Shopping", color: "#2dd4bf" },
    { name: "Other", color: "#94a3b8" },
    { name: "Salary", color: "#4ade80" },
    { name: "Other Income", color: "#86efac" }
  ];
  const catColor = Object.fromEntries(CATEGORIES.map(c => [c.name, c.color]));
  const expenseCategories = CATEGORIES.filter(c => !/Income|Salary/.test(c.name)).map(c => c.name);
  const incomeCategories = ["Salary", "Other Income"];

  const BUDGETS = {
    Housing: 1500, Food: 600, Transport: 250, Utilities: 200,
    Entertainment: 150, Health: 100, Shopping: 300, Other: 150
  };

  const fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  const $ = id => document.getElementById(id);

  // ---------- Data ----------
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function seedData() {
    const now = new Date();
    const txs = [];
    for (let m = 5; m >= 0; m--) {
      const base = new Date(now.getFullYear(), now.getMonth() - m, 1);
      const y = base.getFullYear(), mo = base.getMonth();
      const d = day => new Date(y, mo, Math.min(day, 28)).toISOString().slice(0, 10);
      txs.push({ id: uid(), date: d(1), description: "Rent", category: "Housing", type: "expense", amount: 1450 });
      txs.push({ id: uid(), date: d(1), description: "Paycheck", category: "Salary", type: "income", amount: 4200 });
      txs.push({ id: uid(), date: d(15), description: "Paycheck", category: "Salary", type: "income", amount: 4200 });
      txs.push({ id: uid(), date: d(3), description: "Electric & Water", category: "Utilities", type: "expense", amount: 118 + m * 3 });
      txs.push({ id: uid(), date: d(5), description: "Internet", category: "Utilities", type: "expense", amount: 65 });
      txs.push({ id: uid(), date: d(7), description: "Grocery run", category: "Food", type: "expense", amount: 210 + (m * 17) % 60 });
      txs.push({ id: uid(), date: d(14), description: "Grocery run", category: "Food", type: "expense", amount: 185 + (m * 11) % 50 });
      txs.push({ id: uid(), date: d(10), description: "Gas", category: "Transport", type: "expense", amount: 55 + (m * 7) % 20 });
      txs.push({ id: uid(), date: d(18), description: "Streaming & games", category: "Entertainment", type: "expense", amount: 48 });
      txs.push({ id: uid(), date: d(20), description: "Dinner out", category: "Food", type: "expense", amount: 72 + (m * 13) % 40 });
      txs.push({ id: uid(), date: d(22), description: "Pharmacy", category: "Health", type: "expense", amount: 34 });
      txs.push({ id: uid(), date: d(25), description: "Online order", category: "Shopping", type: "expense", amount: 140 + (m * 19) % 90 });
      if (m % 2 === 0) txs.push({ id: uid(), date: d(12), description: "Freelance gig", category: "Other Income", type: "income", amount: 650 });
    }
    return txs;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    const seed = seedData();
    save(seed);
    return seed;
  }
  function save(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (_) {}
  }

  let txs = load();

  // ---------- Helpers ----------
  const monthKey = d => d.slice(0, 7);
  function monthLabel(key) {
    const [y, m] = key.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
  }
  function allMonths() {
    const set = new Set(txs.map(t => monthKey(t.date)));
    set.add(monthKey(new Date().toISOString().slice(0, 10)));
    return [...set].sort().reverse();
  }
  function prevMonth(key) {
    const [y, m] = key.split("-").map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }
  function sumFor(key, type) {
    return txs.filter(t => monthKey(t.date) === key && t.type === type)
              .reduce((s, t) => s + Number(t.amount), 0);
  }
  function pctDelta(cur, prev) {
    if (!prev) return cur ? "new" : "–";
    const p = ((cur - prev) / prev) * 100;
    return `${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(0)}% vs last month`;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Month selector ----------
  let currentMonth = monthKey(new Date().toISOString().slice(0, 10));
  function renderMonthSelect() {
    const sel = $("monthSelect");
    const months = allMonths();
    if (!months.includes(currentMonth)) months.unshift(currentMonth);
    sel.innerHTML = months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join("");
    sel.value = currentMonth;
  }
  $("monthSelect").addEventListener("change", e => {
    currentMonth = e.target.value;
    renderAll();
  });

  // ---------- Summary cards ----------
  function renderSummary() {
    const inc = sumFor(currentMonth, "income");
    const exp = sumFor(currentMonth, "expense");
    const net = inc - exp;
    const prev = prevMonth(currentMonth);
    const pInc = sumFor(prev, "income");
    const pExp = sumFor(prev, "expense");
    const pNet = pInc - pExp;
    const rate = inc ? (net / inc) * 100 : 0;
    const pRate = pInc ? (pNet / pInc) * 100 : 0;

    $("periodLabel").textContent = `Overview for ${monthLabel(currentMonth)}`;

    const netEl = $("netBalance");
    netEl.textContent = fmt.format(net);
    netEl.className = "value " + (net >= 0 ? "pos" : "neg");
    $("netDelta").textContent = pctDelta(net, pNet);

    $("incomeTotal").textContent = fmt.format(inc);
    $("incomeDelta").textContent = pctDelta(inc, pInc);

    $("expenseTotal").textContent = fmt.format(exp);
    $("expenseDelta").textContent = pctDelta(exp, pExp);

    $("savingsRate").textContent = rate.toFixed(1) + "%";
    $("savingsRate").className = "value " + (rate >= 20 ? "pos" : rate < 0 ? "neg" : "");
    $("savingsDelta").textContent = `${(rate - pRate).toFixed(1)} pts vs last month`;
  }

  // ---------- Canvas charts (no external deps) ----------
  function setupCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w: rect.width, h: rect.height };
  }

  function renderTrend() {
    const canvas = $("trendChart");
    const { ctx, w, h } = setupCanvas(canvas);
    ctx.clearRect(0, 0, w, h);

    // Last 6 months ending at currentMonth
    const [cy, cm] = currentMonth.split("-").map(Number);
    const keys = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(cy, cm - 1 - i, 1);
      keys.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
    }
    const incs = keys.map(k => sumFor(k, "income"));
    const exps = keys.map(k => sumFor(k, "expense"));
    const max = Math.max(1, ...incs, ...exps) * 1.1;

    const pad = { l: 56, r: 12, t: 12, b: 28 };
    const plotW = w - pad.l - pad.r;
    const plotH = h - pad.t - pad.b;

    ctx.strokeStyle = "#334155";
    ctx.fillStyle = "#94a3b8";
    ctx.font = "12px -apple-system, sans-serif";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (plotH / 4) * i;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      const v = max * (1 - i / 4);
      ctx.textAlign = "right";
      ctx.fillText("$" + Math.round(v).toLocaleString(), pad.l - 8, y + 4);
    }

    const groupW = plotW / keys.length;
    const barW = Math.min(18, groupW * 0.3);
    keys.forEach((k, i) => {
      const cx = pad.l + groupW * i + groupW / 2;
      const ih = (incs[i] / max) * plotH;
      const eh = (exps[i] / max) * plotH;
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(cx - barW - 2, pad.t + plotH - ih, barW, ih);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(cx + 2, pad.t + plotH - eh, barW, eh);
      ctx.fillStyle = "#94a3b8";
      ctx.textAlign = "center";
      const [y, m] = k.split("-").map(Number);
      ctx.fillText(new Date(y, m - 1, 1).toLocaleString("en-US", { month: "short" }), cx, h - 8);
    });
  }

  function renderCategoryChart() {
    const canvas = $("categoryChart");
    const { ctx, w, h } = setupCanvas(canvas);
    ctx.clearRect(0, 0, w, h);

    const totals = {};
    txs.filter(t => monthKey(t.date) === currentMonth && t.type === "expense")
       .forEach(t => totals[t.category] = (totals[t.category] || 0) + Number(t.amount));
    const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((s, [, v]) => s + v, 0);

    const legend = $("categoryLegend");
    if (!total) {
      ctx.fillStyle = "#94a3b8";
      ctx.textAlign = "center";
      ctx.font = "14px sans-serif";
      ctx.fillText("No expenses this month", w / 2, h / 2);
      legend.innerHTML = "";
      return;
    }

    const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 10, inner = r * 0.6;
    let start = -Math.PI / 2;
    entries.forEach(([cat, val]) => {
      const angle = (val / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(start) * inner, cy + Math.sin(start) * inner);
      ctx.arc(cx, cy, r, start, start + angle);
      ctx.arc(cx, cy, inner, start + angle, start, true);
      ctx.closePath();
      ctx.fillStyle = catColor[cat] || "#94a3b8";
      ctx.fill();
      start += angle;
    });

    ctx.fillStyle = "#e2e8f0";
    ctx.textAlign = "center";
    ctx.font = "600 16px -apple-system, sans-serif";
    ctx.fillText(fmt.format(total), cx, cy + 6);

    legend.innerHTML = entries.map(([cat, val]) =>
      `<span style="--c:${catColor[cat] || "#94a3b8"}">${escapeHtml(cat)} · ${Math.round((val / total) * 100)}%</span>`
    ).join("");
    legend.querySelectorAll("span").forEach(s => {
      s.style.setProperty("--dot", s.style.getPropertyValue("--c"));
    });
    // Apply per-category color to legend dots
    legend.querySelectorAll("span").forEach(s => {
      s.style.color = "#94a3b8";
      s.style.display = "inline-flex";
      s.style.alignItems = "center";
      s.style.gap = "6px";
      const dot = document.createElement("i");
      dot.style.cssText = `width:10px;height:10px;border-radius:2px;background:${s.style.getPropertyValue("--c")};display:inline-block`;
      s.prepend(dot);
    });
  }

  // ---------- Budgets ----------
  function renderBudgets() {
    const spent = {};
    txs.filter(t => monthKey(t.date) === currentMonth && t.type === "expense")
       .forEach(t => spent[t.category] = (spent[t.category] || 0) + Number(t.amount));

    const rows = Object.entries(BUDGETS).map(([cat, limit]) => {
      const s = spent[cat] || 0;
      const pct = Math.min(100, (s / limit) * 100);
      const over = s > limit;
      return `
        <div class="budget-row">
          <div class="head">
            <span>${escapeHtml(cat)}</span>
            <span class="${over ? "neg" : ""}">${fmt.format(s)} <span class="muted">/ ${fmt.format(limit)}</span></span>
          </div>
          <div class="track"><div class="fill ${over ? "over" : ""}" style="width:${pct}%"></div></div>
        </div>`;
    }).join("");
    $("budgets").innerHTML = rows;
  }

  // ---------- Category select for form ----------
  function renderCategorySelect() {
    const sel = $("categorySelect");
    const typeSel = document.querySelector('#addForm select[name="type"]');
    const fill = () => {
      const list = typeSel.value === "income" ? incomeCategories : expenseCategories;
      sel.innerHTML = list.map(c => `<option>${escapeHtml(c)}</option>`).join("");
    };
    typeSel.onchange = fill;
    fill();
  }

  // ---------- Transactions table ----------
  function renderTable() {
    const q = $("searchInput").value.trim().toLowerCase();
    const typeF = $("typeFilter").value;
    const sort = $("sortSelect").value;

    let list = txs.filter(t => monthKey(t.date) === currentMonth);
    if (typeF !== "all") list = list.filter(t => t.type === typeF);
    if (q) list = list.filter(t =>
      t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));

    list.sort((a, b) => {
      switch (sort) {
        case "date-asc": return a.date.localeCompare(b.date);
        case "amount-desc": return b.amount - a.amount;
        case "amount-asc": return a.amount - b.amount;
        default: return b.date.localeCompare(a.date);
      }
    });

    $("txBody").innerHTML = list.map(t => `
      <tr>
        <td>${escapeHtml(t.date)}</td>
        <td>${escapeHtml(t.description)}</td>
        <td><span class="tag" style="border-left:3px solid ${catColor[t.category] || "#94a3b8"}">${escapeHtml(t.category)}</span></td>
        <td class="num ${t.type === "income" ? "pos" : "neg"}">${t.type === "income" ? "+" : "−"}${fmt.format(t.amount)}</td>
        <td><button class="icon-btn" data-del="${t.id}" aria-label="Delete">✕</button></td>
      </tr>`).join("");
    $("txEmpty").hidden = list.length > 0;
  }

  $("txBody").addEventListener("click", e => {
    const id = e.target.dataset.del;
    if (!id) return;
    if (!confirm("Delete this transaction?")) return;
    txs = txs.filter(t => t.id !== id);
    save(txs);
    renderAll();
  });

  ["searchInput", "typeFilter", "sortSelect"].forEach(id =>
    $(id).addEventListener("input", renderTable));

  // ---------- Add transaction ----------
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const amount = Number(f.get("amount"));
    if (!(amount > 0)) return;
    txs.push({
      id: uid(),
      date: f.get("date"),
      description: String(f.get("description")).trim(),
      category: f.get("category"),
      type: f.get("type"),
      amount: Math.round(amount * 100) / 100
    });
    save(txs);
    currentMonth = monthKey(f.get("date"));
    e.target.reset();
    renderCategorySelect();
    renderMonthSelect();
    renderAll();
  });

  // ---------- Export / reset ----------
  $("exportBtn").addEventListener("click", () => {
    const rows = [["date", "description", "category", "type", "amount"],
      ...txs.map(t => [t.date, t.description, t.category, t.type, t.amount])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: "transactions.csv" });
    a.click();
    URL.revokeObjectURL(url);
  });

  $("resetBtn").addEventListener("click", () => {
    if (!confirm("Replace all data with fresh demo data?")) return;
    txs = seedData();
    save(txs);
    currentMonth = monthKey(new Date().toISOString().slice(0, 10));
    renderMonthSelect();
    renderAll();
  });

  // ---------- Render orchestration ----------
  function renderAll() {
    renderMonthSelect();
    renderSummary();
    renderTrend();
    renderCategoryChart();
    renderBudgets();
    renderTable();
  }

  window.addEventListener("resize", () => renderAll());

  renderCategorySelect();
  renderAll();
})();
</script>
</body>
</html>
