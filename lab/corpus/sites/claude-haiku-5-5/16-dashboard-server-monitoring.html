<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Monitoring Dashboard</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --panel-2: #222b35;
    --border: #2d3742;
    --text: #e6edf3;
    --muted: #8b98a5;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
  .dot.pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  button, select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--blue); }

  main { padding: 24px; max-width: 1400px; margin: 0 auto; }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 28px; font-weight: 600; margin-top: 6px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .servers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .server-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .server-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .server-name { font-weight: 600; font-size: 15px; }
  .server-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px; letter-spacing: .04em;
  }
  .badge.online { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.warning { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge.offline { background: rgba(248,81,73,.15); color: var(--red); }

  .metric { display: flex; flex-direction: column; gap: 6px; }
  .metric-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .metric-row strong { color: var(--text); font-weight: 600; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .6s ease, background .3s; }

  .spark { width: 100%; height: 40px; display: block; }
  .spark-wrap { display: flex; flex-direction: column; gap: 4px; }
  .spark-label { font-size: 11px; color: var(--muted); }

  .footer-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }

  .alerts {
    margin-top: 24px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .alerts-head { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .alert-list { max-height: 260px; overflow-y: auto; }
  .alert-item {
    display: grid; grid-template-columns: 90px 90px 1fr auto; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    font-size: 13px; align-items: center;
  }
  .alert-item:last-child { border-bottom: none; }
  .alert-time { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 12px; }
  .alert-sev { font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .alert-sev.critical { color: var(--red); }
  .alert-sev.warning { color: var(--yellow); }
  .alert-sev.info { color: var(--blue); }
  .alert-host { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }

  @media (max-width: 600px) {
    .alert-item { grid-template-columns: 1fr; gap: 4px; }
    header { padding: 12px 16px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Server Monitoring</h1>
  <div class="header-right">
    <span class="status-pill"><span class="dot pulse" id="live-dot"></span><span id="live-text">Live</span></span>
    <span>Last update: <span id="last-update">--:--:--</span></span>
    <select id="refresh-interval" aria-label="Refresh interval">
      <option value="1000">1s</option>
      <option value="2000" selected>2s</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
    </select>
    <button id="pause-btn">Pause</button>
  </div>
</header>

<main>
  <section class="summary">
    <div class="stat-card">
      <div class="stat-label">Servers Online</div>
      <div class="stat-value" id="sum-online">0/0</div>
      <div class="stat-sub" id="sum-online-sub">&nbsp;</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg CPU</div>
      <div class="stat-value" id="sum-cpu">0%</div>
      <div class="stat-sub">across online hosts</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Memory</div>
      <div class="stat-value" id="sum-mem">0%</div>
      <div class="stat-sub">across online hosts</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Alerts</div>
      <div class="stat-value" id="sum-alerts">0</div>
      <div class="stat-sub" id="sum-alerts-sub">no critical issues</div>
    </div>
  </section>

  <section class="servers" id="servers"></section>

  <section class="alerts">
    <div class="alerts-head">
      <span>Recent Alerts</span>
      <button id="clear-alerts">Clear</button>
    </div>
    <div class="alert-list" id="alert-list">
      <div class="empty">No alerts yet</div>
    </div>
  </section>
</main>

<script>
(() => {
  const HISTORY_LEN = 40;

  // Simulated fleet. Replace `fetchMetrics` with a real API call when wiring to a backend.
  const fleet = [
    { id: "web-01",  name: "web-01",   role: "Web / Nginx",     ip: "10.0.1.11", cpu: 35, mem: 52, disk: 41, net: 60, load: 1.2, uptime: 36 },
    { id: "web-02",  name: "web-02",   role: "Web / Nginx",     ip: "10.0.1.12", cpu: 48, mem: 61, disk: 44, net: 55, load: 1.8, uptime: 72 },
    { id: "api-01",  name: "api-01",   role: "API / Node.js",   ip: "10.0.2.21", cpu: 62, mem: 70, disk: 58, net: 80, load: 2.9, uptime: 140 },
    { id: "db-01",   name: "db-01",    role: "PostgreSQL",      ip: "10.0.3.31", cpu: 27, mem: 83, disk: 72, net: 35, load: 0.9, uptime: 912 },
    { id: "cache-01",name: "cache-01", role: "Redis",           ip: "10.0.4.41", cpu: 12, mem: 38, disk: 22, net: 25, load: 0.4, uptime: 410 },
    { id: "worker-01", name: "worker-01", role: "Background Jobs", ip: "10.0.5.51", cpu: 78, mem: 64, disk: 66, net: 40, load: 3.7, uptime: 18 },
  ];

  const state = fleet.map(s => ({
    ...s,
    status: "online",
    history: { cpu: [], mem: [], net: [] },
  }));

  const alerts = [];
  let paused = false;
  let timer = null;

  const $ = sel => document.querySelector(sel);
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const rand = (min, max) => min + Math.random() * (max - min);
  const pad = n => String(n).padStart(2, "0");
  const nowStr = () => {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };

  function fetchMetrics(server) {
    // Simulated drift with occasional spikes and rare outages.
    if (server.status === "offline") {
      if (Math.random() < 0.15) server.status = "online";
      else return null;
    } else if (Math.random() < 0.01) {
      server.status = "offline";
      return null;
    }
    server.cpu  = clamp(server.cpu  + rand(-6, 6), 2, 100);
    server.mem  = clamp(server.mem  + rand(-2, 2.5), 10, 99);
    server.disk = clamp(server.disk + rand(-0.1, 0.2), 5, 99);
    server.net  = clamp(server.net  + rand(-12, 12), 0, 100);
    server.load = clamp(server.load + rand(-0.3, 0.3), 0, 16);
    server.uptime += 0.04;
    if (Math.random() < 0.03) server.cpu = clamp(server.cpu + rand(20, 35), 0, 100);
    return {
      cpu: server.cpu, mem: server.mem, disk: server.disk,
      net: server.net, load: server.load, uptime: server.uptime,
    };
  }

  function severityFor(s) {
    if (s.status === "offline") return "offline";
    if (s.cpu > 90 || s.mem > 92 || s.disk > 90) return "offline";
    if (s.cpu > 75 || s.mem > 80 || s.disk > 80) return "warning";
    return "online";
  }

  function colorFor(pct) {
    if (pct >= 90) return "var(--red)";
    if (pct >= 75) return "var(--yellow)";
    return "var(--green)";
  }

  function formatUptime(hours) {
    const d = Math.floor(hours / 24);
    const h = Math.floor(hours % 24);
    return d > 0 ? `${d}d ${h}h` : `${h}h`;
  }

  function sparkline(values, color) {
    const w = 300, h = 40;
    if (values.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"></svg>`;
    const max = 100;
    const step = w / (HISTORY_LEN - 1);
    const offset = HISTORY_LEN - values.length;
    const pts = values.map((v, i) => {
      const x = (offset + i) * step;
      const y = h - (v / max) * (h - 4) - 2;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    const area = `${(offset * step).toFixed(1)},${h} ${pts} ${((HISTORY_LEN - 1) * step).toFixed(1)},${h}`;
    return `
      <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polygon points="${area}" fill="${color}" fill-opacity="0.12"/>
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg>`;
  }

  function metricRow(label, value, pct) {
    const color = colorFor(pct);
    return `
      <div class="metric">
        <div class="metric-row"><span>${label}</span><strong>${value}</strong></div>
        <div class="bar"><div class="bar-fill" style="width:${clamp(pct,0,100)}%;background:${color}"></div></div>
      </div>`;
  }

  function renderServers() {
    const container = $("#servers");
    container.innerHTML = state.map(s => {
      const sev = severityFor(s);
      const badgeLabel = sev === "online" ? "Healthy" : sev === "warning" ? "Warning" : s.status === "offline" ? "Offline" : "Critical";
      const badgeClass = sev === "offline" && s.status !== "offline" ? "offline" : sev;

      if (s.status === "offline") {
        return `
          <article class="server-card">
            <div class="server-head">
              <div>
                <div class="server-name">${s.name}</div>
                <div class="server-meta">${s.ip} · ${s.role}</div>
              </div>
              <span class="badge offline">Offline</span>
            </div>
            <div class="empty">No heartbeat received</div>
          </article>`;
      }

      return `
        <article class="server-card">
          <div class="server-head">
            <div>
              <div class="server-name">${s.name}</div>
              <div class="server-meta">${s.ip} · ${s.role}</div>
            </div>
            <span class="badge ${badgeClass}">${badgeLabel}</span>
          </div>
          ${metricRow("CPU", s.cpu.toFixed(1) + "%", s.cpu)}
          ${metricRow("Memory", s.mem.toFixed(1) + "%", s.mem)}
          ${metricRow("Disk", s.disk.toFixed(1) + "%", s.disk)}
          <div class="spark-wrap">
            <div class="spark-label">CPU history</div>
            ${sparkline(s.history.cpu, colorFor(s.cpu))}
          </div>
          <div class="footer-row">
            <span>Load ${s.load.toFixed(2)}</span>
            <span>Net ${s.net.toFixed(0)}%</span>
            <span>Up ${formatUptime(s.uptime)}</span>
          </div>
        </article>`;
    }).join("");
  }

  function renderSummary() {
    const online = state.filter(s => s.status === "online");
    const avg = key => online.length ? online.reduce((a, s) => a + s[key], 0) / online.length : 0;
    const critical = state.filter(s => severityFor(s) === "offline" && s.status === "online").length;
    const warnings = state.filter(s => severityFor(s) === "warning").length;
    const offline = state.length - online.length;

    $("#sum-online").textContent = `${online.length}/${state.length}`;
    $("#sum-online-sub").textContent = offline ? `${offline} offline` : "all hosts reporting";
    $("#sum-cpu").textContent = avg("cpu").toFixed(1) + "%";
    $("#sum-mem").textContent = avg("mem").toFixed(1) + "%";
    $("#sum-alerts").textContent = alerts.filter(a => !a.resolved).length;
    $("#sum-alerts-sub").textContent = critical
      ? `${critical} critical, ${warnings} warning`
      : warnings ? `${warnings} warning` : "no critical issues";
  }

  function renderAlerts() {
    const list = $("#alert-list");
    if (!alerts.length) {
      list.innerHTML = `<div class="empty">No alerts yet</div>`;
      return;
    }
    list.innerHTML = alerts.slice(0, 50).map(a => `
      <div class="alert-item">
        <span class="alert-time">${a.time}</span>
        <span class="alert-sev ${a.severity}">${a.severity}</span>
        <span>${a.message}</span>
        <span class="alert-host">${a.host}</span>
      </div>`).join("");
  }

  function pushAlert(host, severity, message) {
    alerts.unshift({ time: nowStr(), host, severity, message, resolved: false });
    if (alerts.length > 200) alerts.length = 200;
  }

  function checkThresholds(s, prevSev) {
    const sev = severityFor(s);
    if (sev !== prevSev && s.status === "online") {
      if (sev === "offline") pushAlert(s.name, "critical", "Health threshold exceeded");
      else if (sev === "warning") pushAlert(s.name, "warning", "Resource usage elevated");
    }
    if (s.status === "offline" && prevSev !== "offline") {
      pushAlert(s.name, "critical", "Host stopped responding");
    }
  }

  function tick() {
    const updates = new Map();
    state.forEach(s => {
      const prev = severityFor(s);
      const m = fetchMetrics(s);
      if (m) {
        s.history.cpu.push(m.cpu);
        s.history.mem.push(m.mem);
        s.history.net.push(m.net);
        ["cpu", "mem", "net"].forEach(k => {
          if (s.history[k].length > HISTORY_LEN) s.history[k].shift();
        });
      }
      checkThresholds(s, prev);
      updates.set(s.id, true);
    });
    renderServers();
    renderSummary();
    renderAlerts();
    $("#last-update").textContent = nowStr();
  }

  function setLive(live) {
    $("#live-dot").style.background = live ? "var(--green)" : "var(--muted)";
    $("#live-dot").classList.toggle("pulse", live);
    $("#live-text").textContent = live ? "Live" : "Paused";
  }

  function start() {
    clearInterval(timer);
    const ms = Number($("#refresh-interval").value);
    timer = setInterval(tick, ms);
  }

  $("#refresh-interval").addEventListener("change", () => { if (!paused) start(); });
  $("#pause-btn").addEventListener("click", e => {
    paused = !paused;
    e.target.textContent = paused ? "Resume" : "Pause";
    setLive(!paused);
    if (paused) clearInterval(timer); else { tick(); start(); }
  });
  $("#clear-alerts").addEventListener("click", () => {
    alerts.length = 0;
    renderAlerts();
    renderSummary();
  });

  tick();
  start();
})();
</script>
</body>
</html>
