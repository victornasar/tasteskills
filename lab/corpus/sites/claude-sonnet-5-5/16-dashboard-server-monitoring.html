<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Monitor</title>
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--border:#2a323d;
    --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;
    --ok:#3fb950;--warn:#d29922;--crit:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:10px}
  h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .controls{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
  select,button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  button:hover,select:hover{border-color:var(--accent)}
  main{padding:20px 24px;max-width:1500px;margin:auto}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .card .value{font-size:26px;font-weight:600;margin-top:4px}
  .card .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:20px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .panel h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .panel h2 span{color:var(--text);font-size:16px;text-transform:none;letter-spacing:0}
  canvas{width:100%;height:150px;display:block}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
  th:hover{color:var(--text)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .table-wrap{overflow-x:auto}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .b-ok{color:var(--ok);background:rgba(63,185,80,.12)}
  .b-warn{color:var(--warn);background:rgba(210,153,34,.12)}
  .b-crit{color:var(--crit);background:rgba(248,81,73,.12)}
  .bar{width:90px;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .bar div{height:100%;border-radius:4px;transition:width .6s,background .6s}
  .two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  @media(max-width:1000px){.two{grid-template-columns:1fr}}
  .alerts{list-style:none;max-height:300px;overflow-y:auto}
  .alerts li{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;align-items:flex-start}
  .alerts li:last-child{border-bottom:none}
  .alerts time{color:var(--muted);font-size:12px;min-width:62px}
  .empty{color:var(--muted);padding:20px 0;text-align:center}
  .disk{margin-bottom:12px}
  .disk .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .disk .track{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .disk .track div{height:100%;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="liveDot"></span>Server Monitor</h1>
  <div class="controls">
    <span id="clock"></span>
    <label>Server
      <select id="serverSel"></select>
    </label>
    <label>Refresh
      <select id="rate">
        <option value="1000">1s</option>
        <option value="2000" selected>2s</option>
        <option value="5000">5s</option>
        <option value="0">Paused</option>
      </select>
    </label>
    <button id="chaos" title="Simulate a load spike">Simulate spike</button>
  </div>
</header>

<main>
  <section class="summary" id="summary"></section>

  <section class="grid">
    <div class="panel"><h2>CPU usage <span id="cpuNow"></span></h2><canvas id="cpuChart"></canvas></div>
    <div class="panel"><h2>Memory usage <span id="memNow"></span></h2><canvas id="memChart"></canvas></div>
    <div class="panel">
      <h2>Network <span id="netNow"></span></h2><canvas id="netChart"></canvas>
      <div class="legend"><div><i style="background:#58a6ff"></i>Inbound</div><div><i style="background:#bc8cff"></i>Outbound</div></div>
    </div>
    <div class="panel"><h2>Response time <span id="latNow"></span></h2><canvas id="latChart"></canvas></div>
  </section>

  <section class="two">
    <div class="panel">
      <h2>Servers</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-k="name">Name</th><th data-k="status">Status</th><th data-k="cpu">CPU</th>
            <th data-k="mem">Memory</th><th data-k="load">Load</th><th data-k="uptime">Uptime</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="panel"><h2>Disk <span id="diskSrv" style="font-size:13px;color:var(--muted)"></span></h2><div id="disks"></div></div>
      <div class="panel"><h2>Alerts</h2><ul class="alerts" id="alerts"><li class="empty">No alerts</li></ul></div>
    </div>
  </section>
</main>

<script>
(() => {
  const HISTORY = 60;
  const $ = id => document.getElementById(id);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const rand = (a,b) => a + Math.random()*(b-a);
  const colorFor = v => v >= 90 ? 'var(--crit)' : v >= 75 ? 'var(--warn)' : 'var(--ok)';
  const statusFor = s => Math.max(s.cpu, s.mem) >= 90 ? 'crit' : Math.max(s.cpu, s.mem) >= 75 ? 'warn' : 'ok';
  const statusLabel = {ok:'Healthy', warn:'Warning', crit:'Critical'};

  const names = ['web-01','web-02','api-01','api-02','db-primary','db-replica','cache-01','worker-01'];
  const servers = names.map((name,i) => ({
    name, status:'ok',
    cpu: rand(15,55), mem: rand(30,65), load: rand(.3,2),
    netIn: rand(5,40), netOut: rand(3,25), lat: rand(20,90),
    uptime: Math.floor(rand(2,90)*86400),
    disks: [
      {mount:'/', pct: rand(35,70)},
      {mount:'/var', pct: rand(30,80)},
      {mount:'/data', pct: rand(40,85)}
    ],
    h: {cpu:[],mem:[],netIn:[],netOut:[],lat:[]},
    spike: 0, lastState:'ok'
  }));

  let selected = 0, sortKey = 'name', sortDir = 1, timer = null;
  const alerts = [];

  // seed history
  servers.forEach(s => { for(let i=0;i<HISTORY;i++) step(s,true); });

  function step(s, silent){
    const spikeBoost = s.spike > 0 ? 35 : 0;
    if (s.spike > 0) s.spike--;
    s.cpu = clamp(s.cpu + rand(-6,6) + (spikeBoost ? (spikeBoost - (s.cpu-50))*.15 : (45 - s.cpu)*.03), 2, 99);
    s.mem = clamp(s.mem + rand(-1.5,1.6) + (spikeBoost ? 1.2 : (50 - s.mem)*.01), 10, 98);
    s.load = clamp(s.cpu/100*4 + rand(-.2,.2), .05, 8);
    s.netIn = clamp(s.netIn + rand(-8,8) + (spikeBoost?10:0), 1, 200);
    s.netOut = clamp(s.netOut + rand(-5,5) + (spikeBoost?6:0), 1, 150);
    s.lat = clamp(s.lat + rand(-12,12) + (s.cpu>80?15:(50-s.lat)*.05), 8, 900);
    s.uptime += 1;
    s.disks.forEach(d => d.pct = clamp(d.pct + rand(-.05,.12), 5, 99));
    for (const k of ['cpu','mem','netIn','netOut','lat']){
      s.h[k].push(s[k]); if (s.h[k].length > HISTORY) s.h[k].shift();
    }
    const st = statusFor(s);
    if (!silent && st !== s.lastState){
      if (st !== 'ok') addAlert(st, `${s.name}: ${st==='crit'?'critical':'high'} resource usage (CPU ${s.cpu.toFixed(0)}%, MEM ${s.mem.toFixed(0)}%)`);
      else addAlert('ok', `${s.name}: recovered`);
    }
    s.lastState = st; s.status = st;
  }

  function addAlert(level, msg){
    alerts.unshift({level, msg, t:new Date()});
    if (alerts.length > 50) alerts.pop();
  }

  function fmtUptime(sec){
    const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
    return `${d}d ${h}h ${m}m`;
  }

  // ---- charts ----
  function drawChart(canvas, series, opts={}){
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w*dpr || canvas.height !== h*dpr){ canvas.width = w*dpr; canvas.height = h*dpr; }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    const pad = {l:32,r:6,t:6,b:6};
    const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
    const max = opts.max || Math.max(10, ...series.flatMap(s => s.data)) * 1.15;
    ctx.font = '10px sans-serif'; ctx.fillStyle = '#8b949e'; ctx.strokeStyle = '#2a323d'; ctx.lineWidth = 1;
    for (let i=0;i<=4;i++){
      const y = pad.t + ih*i/4;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
      ctx.textAlign='right'; ctx.fillText(Math.round(max*(1-i/4)), pad.l-5, y+3);
    }
    series.forEach(s => {
      const n = s.data.length; if (n < 2) return;
      const pts = s.data.map((v,i) => [pad.l + iw*i/(HISTORY-1) + iw*(HISTORY-n)/(HISTORY-1), pad.t + ih*(1-v/max)]);
      ctx.beginPath(); pts.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
      ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.stroke();
      ctx.lineTo(pts[n-1][0], pad.t+ih); ctx.lineTo(pts[0][0], pad.t+ih); ctx.closePath();
      const g = ctx.createLinearGradient(0,pad.t,0,pad.t+ih);
      g.addColorStop(0, s.color+'55'); g.addColorStop(1, s.color+'00');
      ctx.fillStyle = g; ctx.fill();
    });
  }

  // ---- render ----
  function render(){
    const s = servers[selected];
    const online = servers.length;
    const crit = servers.filter(x => x.status==='crit').length;
    const warn = servers.filter(x => x.status==='warn').length;
    const avgCpu = servers.reduce((a,x)=>a+x.cpu,0)/online;
    const avgMem = servers.reduce((a,x)=>a+x.mem,0)/online;
    const avgLat = servers.reduce((a,x)=>a+x.lat,0)/online;
    const bw = servers.reduce((a,x)=>a+x.netIn+x.netOut,0);

    $('summary').innerHTML = [
      ['Servers online', `${online}/${online}`, `${crit} critical · ${warn} warning`, crit?'var(--crit)':warn?'var(--warn)':'var(--ok)'],
      ['Avg CPU', avgCpu.toFixed(1)+'%', 'across fleet', colorFor(avgCpu)],
      ['Avg memory', avgMem.toFixed(1)+'%', 'across fleet', colorFor(avgMem)],
      ['Avg response', avgLat.toFixed(0)+' ms', 'p50 estimate', avgLat>200?'var(--crit)':avgLat>120?'var(--warn)':'var(--ok)'],
      ['Throughput', bw.toFixed(0)+' MB/s', 'in + out', 'var(--accent)']
    ].map(([l,v,sub,c]) => `<div class="card"><div class="label">${l}</div><div class="value" style="color:${c}">${v}</div><div class="sub">${sub}</div></div>`).join('');

    $('cpuNow').textContent = s.cpu.toFixed(1)+'%';
    $('memNow').textContent = s.mem.toFixed(1)+'%';
    $('netNow').textContent = `↓${s.netIn.toFixed(0)} ↑${s.netOut.toFixed(0)} MB/s`;
    $('latNow').textContent = s.lat.toFixed(0)+' ms';
    drawChart($('cpuChart'), [{data:s.h.cpu,color:'#3fb950'}], {max:100});
    drawChart($('memChart'), [{data:s.h.mem,color:'#d29922'}], {max:100});
    drawChart($('netChart'), [{data:s.h.netIn,color:'#58a6ff'},{data:s.h.netOut,color:'#bc8cff'}]);
    drawChart($('latChart'), [{data:s.h.lat,color:'#f0883e'}]);

    const rows = [...servers].sort((a,b) => {
      const x = a[sortKey], y = b[sortKey];
      return (typeof x==='string' ? x.localeCompare(y) : x-y) * sortDir;
    });
    $('rows').innerHTML = rows.map(x => {
      const bar = v => `<span class="bar"><div style="width:${v}%;background:${colorFor(v)}"></div></span>${v.toFixed(0)}%`;
      return `<tr data-name="${x.name}" style="cursor:pointer;${x===s?'background:var(--panel2)':''}">
        <td><strong>${x.name}</strong></td>
        <td><span class="badge b-${x.status}">${statusLabel[x.status]}</span></td>
        <td>${bar(x.cpu)}</td><td>${bar(x.mem)}</td>
        <td>${x.load.toFixed(2)}</td><td>${fmtUptime(x.uptime)}</td></tr>`;
    }).join('');

    $('diskSrv').textContent = s.name;
    $('disks').innerHTML = s.disks.map(d => `<div class="disk"><div class="row"><span>${d.mount}</span><span>${d.pct.toFixed(0)}%</span></div><div class="track"><div style="width:${d.pct}%;background:${colorFor(d.pct)}"></div></div></div>`).join('');

    $('alerts').innerHTML = alerts.length
      ? alerts.map(a => `<li><time>${a.t.toLocaleTimeString([], {hour12:false})}</time><span class="badge b-${a.level}" style="padding:0 7px">${a.level==='ok'?'OK':a.level==='warn'?'WARN':'CRIT'}</span><span>${a.msg}</span></li>`).join('')
      : '<li class="empty">No alerts</li>';
  }

  function tick(){ servers.forEach(s => step(s)); render(); }

  function setTimer(){
    clearInterval(timer);
    const ms = +$('rate').value;
    $('liveDot').style.animationPlayState = ms ? 'running' : 'paused';
    if (ms) timer = setInterval(tick, ms);
  }

  // ---- events ----
  $('serverSel').innerHTML = servers.map((s,i) => `<option value="${i}">${s.name}</option>`).join('');
  $('serverSel').onchange = e => { selected = +e.target.value; render(); };
  $('rate').onchange = setTimer;
  $('chaos').onclick = () => {
    const s = servers[Math.floor(Math.random()*servers.length)];
    s.spike = 12; addAlert('warn', `Load spike injected on ${s.name} (simulated)`); render();
  };
  $('rows').onclick = e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    selected = servers.findIndex(s => s.name === tr.dataset.name);
    $('serverSel').value = selected; render();
  };
  document.querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k; sortDir = sortKey===k ? -sortDir : 1; sortKey = k; render();
  });
  window.addEventListener('resize', render);
  setInterval(() => $('clock').textContent = new Date().toLocaleString(), 1000);
  $('clock').textContent = new Date().toLocaleString();

  render(); setTimer();
})();
</script>
</body>
</html>
