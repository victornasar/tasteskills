<style>
/* Layout: a working tool. One pair at a time, two screenshots side by side, the verdict directly below them.
   The chrome stays quiet and neutral so it never competes with the designs being judged. */
:root {
  --bg: #f3f2ef;
  --surface: #fbfaf8;
  --ink: #1d1c1a;
  --muted: #67645e;
  --line: #d8d5ce;
  --accent: #1f4e79;
  --accent-ink: #ffffff;
  --done: #2f6b3f;
  --font-text: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --surface: #1f1f1d; --ink: #ecebe7; --muted: #a29f98; --line: #363531;
    --accent: #8fb6dc; --accent-ink: #10202f; --done: #7fbf8e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --surface: #1f1f1d; --ink: #ecebe7; --muted: #a29f98; --line: #363531;
  --accent: #8fb6dc; --accent-ink: #10202f; --done: #7fbf8e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-text);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
.progress { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.intro { max-width: 68ch; color: var(--muted); margin: 0; }
.status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.pairs { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px/1 var(--font-data); padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--surface); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums;
}
.chip[aria-current="true"] { border-color: var(--ink); }
.chip.rated { background: var(--done); border-color: var(--done); color: var(--bg); }
.brief { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; }
.eyebrow { font: 500 12px/1 var(--font-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.brief h2 { font-size: 17px; margin: 0; font-weight: 600; text-wrap: balance; }
.brief p { margin: 0; max-width: 72ch; }
.sites { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.site { min-width: 0; display: grid; gap: 8px; align-content: start; }
.site-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.site-head strong { font-family: var(--font-data); font-size: 13px; font-weight: 500; }
.frame { border: 1px solid var(--line); background: var(--surface); max-height: 78vh; overflow: auto; }
.frame img { display: block; width: 100%; height: auto; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
.verdict { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 12px; }
.verdict legend { font-weight: 600; padding: 0; margin-bottom: 8px; }
fieldset { border: 0; margin: 0; padding: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice {
  font: 500 14px/1 var(--font-text); padding: 11px 16px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
label.note { display: grid; gap: 6px; font-weight: 500; }
textarea {
  font: 14px/1.5 var(--font-text); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 10px; min-height: 84px; width: 100%; max-width: 72ch; resize: vertical;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.primary {
  font: 600 14px/1 var(--font-text); padding: 12px 18px; border-radius: 4px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.primary:disabled { opacity: .45; cursor: default; }
.secondary { font: 500 14px/1 var(--font-text); padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { border: 1px dashed var(--line); padding: 24px; color: var(--muted); max-width: 68ch; }
@media (max-width: 720px) { .sites { grid-template-columns: 1fr; } .frame { max-height: 60vh; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

 "/_blob/fb8c98583d2c272d6e81f58cac32e2de"}, "right": {"fold": "/_blob/6d8df6494e946f2361e3d11768fb4676", "full": "/_blob/c8611323e689b0bbf82e498fc1874228"}}, {"id": "p47", "brief": "fennel-street", "left": {"fold": "/_blob/b7b6b342ee7d22e67c993f89aaa1138f", "full": "/_blob/474d0a004abc96eeb348da789168ea4f"}, "right": {"fold": "/_blob/0dc3071971a6dfa8671f222af903e892", "full": "/_blob/5704b7c20fe54cc5415e32e11307211d"}}, {"id": "p48", "brief": "tallyroll", "left": {"fold": "/_blob/c2f9c2fcdb8dd05c49ac9ad6e5e05734", "full": "/_blob/8c37b75ae60fcaa7166457ffb4a42afb"}, "right": {"fold": "/_blob/f7617566edb745af7cd7feb52cf7aa7b", "full": "/_blob/eb4ef382e165f5cd9c15572d06308f7f"}}, {"id": "p49", "brief": "fennel-street", "left": {"fold": "/_blob/2443b9979ed59156713a25615aa2be16", "full": "/_blob/5855cb2fc69a75b33854cccd4862b9b3"}, "right": {"fold": "/_blob/6fef818a527f3a8a6e39ee2f9d03079b", "full": "/_blob/d627c179c5f0731b9255819beaacd934"}}, {"id": "p50", "brief": "fennel-street", "left": {"fold": "/_blob/a20a62bd6caab4560c961f01b66ef285", "full": "/_blob/3ba4312dc593fa7f76c6fc2eba17fd2e"}, "right": {"fold": "/_blob/a4fd53b1e4afe7fb61ad6c43eb022190", "full": "/_blob/3a3497fb561a274093619e1d93de51ca"}}, {"id": "p51", "brief": "tallyroll", "left": {"fold": "/_blob/55bf7eee61a6b5540a6179a8f05274f7", "full": "/_blob/6a6146ae6f93ac80511541559949abbf"}, "right": {"fold": "/_blob/d93723b9c260e6cdb048642d7ddb2036", "full": "/_blob/8af1b1a3c64eb8b0435f971cb32b10f6"}}, {"id": "p52", "brief": "fennel-street", "left": {"fold": "/_blob/b114f37070e7d342eb1320828fe5d6f7", "full": "/_blob/a6e01b9b1e826d190b433a6111f499f4"}, "right": {"fold": "/_blob/2db6713a00883cd6a906962f30cd3b77", "full": "/_blob/c1c5ff3fc8052902d8ff8fef0d2aeb8c"}}, {"id": "p53", "brief": "tallyroll", "left": {"fold": "/_blob/ff9d4dc701f44231afffd5215fc08878", "full": "/_blob/de66ebdabd091389b01cac589c216bac"}, "right": {"fold": "/_blob/04a7d15db2f6875aabdf403bb1e3dc49", "full": "/_blob/4bd9b67bc30ea284a8fddaa52b20a4ee"}}, {"id": "p54", "brief": "tallyroll", "left": {"fold": "/_blob/b51581122161abb532eaff0d154041a2", "full": "/_blob/6fbec6a147f401dcfa38a738e8a56a6f"}, "right": {"fold": "/_blob/e43bd6f878f97776899643a521edb892", "full": "/_blob/53ff5453427613b0ce8ed8d02441cb41"}}];
const BRIEFS = {
  "tallyroll": {
    name: "Tallyroll",
    line: "A usage-based billing API. Audience: engineering and finance leads who distrust marketing. Register: technical, calm, precise. The page must make a careful buyer trust it with their revenue.",
  },
  "fennel-street": {
    name: "Fennel Street Bakery",
    line: "A neighbourhood bakery run by two sisters. Audience: locals on their phones checking if it's open. Register: warm, local, handmade. The page must show what's baked, the hours and the address, and make cake orders easy.",
  },
};

const state = { index: 0, votes: {}, full: { left: false, right: false } };
let db = null, uid = null, ref = null, writing = Promise.resolve();
const $ = (id) => document.getElementById(id);

function status(text) { $("status").textContent = text; }

function renderChips() {
  const nav = $("chips");
  nav.replaceChildren(...PAIRS.map((p, i) => {
    const b = document.createElement("button");
    b.className = "chip" + (state.votes[p.id] ? " rated" : "");
    b.textContent = String(i + 1).padStart(2, "0");
    b.setAttribute("aria-label", `Pair ${i + 1}${state.votes[p.id] ? ", rated" : ""}`);
    if (i === state.index) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => { state.index = i; state.full = { left: false, right: false }; render(); });
    return b;
  }));
  const done = PAIRS.filter((p) => state.votes[p.id]).length;
  $("progress").textContent = PAIRS.length ? `${done} of ${PAIRS.length} rated` : "";
}

function siteColumn(pair, side) {
  const col = document.createElement("section");
  col.className = "site";
  const head = document.createElement("div");
  head.className = "site-head";
  const label = document.createElement("strong");
  label.textContent = side === "left" ? "Left" : "Right";
  const toggle = document.createElement("button");
  toggle.className = "linkish";
  toggle.textContent = state.full[side] ? "Show first screen" : "Show full page";
  toggle.addEventListener("click", () => { state.full[side] = !state.full[side]; render(); });
  head.append(label, toggle);
  const frame = document.createElement("div");
  frame.className = "frame";
  const img = document.createElement("img");
  img.src = state.full[side] ? pair[side].full : pair[side].fold;
  img.alt = `${side === "left" ? "Left" : "Right"} site, ${state.full[side] ? "full page" : "first screen"}`;
  img.loading = "lazy";
  frame.append(img);
  col.append(head, frame);
  return col;
}

function render() {
  renderChips();
  const main = $("main");
  if (!PAIRS.length) {
    main.innerHTML = '<p class="empty">No pairs are loaded yet. Once the runs are in, this page fills with one pair per brief, model and run.</p>';
    return;
  }
  const pair = PAIRS[state.index];
  const brief = BRIEFS[pair.brief];
  const vote = state.votes[pair.id] || {};
  const draft = { choice: vote.choice || null, note: vote.note || "" };

  const briefEl = document.createElement("div");
  briefEl.className = "brief";
  briefEl.innerHTML = `<span class="eyebrow">Pair ${state.index + 1} · Brief</span><h2></h2><p></p>`;
  briefEl.querySelector("h2").textContent = brief.name;
  briefEl.querySelector("p").textContent = brief.line;

  const sites = document.createElement("div");
  sites.className = "sites";
  sites.append(siteColumn(pair, "left"), siteColumn(pair, "right"));

  const form = document.createElement("form");
  form.className = "verdict";
  form.innerHTML = `
    <fieldset><legend>Which would you ship with fewer changes?</legend><div class="choices"></div></fieldset>
    <label class="note" for="note">What's wrong with the one you didn't pick? <textarea id="note" placeholder="Plain words: what looks generic, off-brief or broken."></textarea></label>
    <div class="actions"><button class="primary" type="submit">Save and next</button><button class="secondary" type="button" id="prev">Previous</button></div>`;
  const choices = form.querySelector(".choices");
  for (const [value, text] of [["left", "Left"], ["right", "Right"], ["tie", "Can't separate them"]]) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice"; b.textContent = text;
    b.setAttribute("aria-pressed", String(draft.choice === value));
    b.addEventListener("click", () => {
      draft.choice = value;
      choices.querySelectorAll(".choice").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
      form.querySelector(".primary").disabled = !db;
    });
    choices.append(b);
  }
  const note = form.querySelector("#note");
  note.value = draft.note;
  note.addEventListener("input", () => { draft.note = note.value; });
  form.querySelector(".primary").disabled = !draft.choice || !db;
  form.querySelector("#prev").disabled = state.index === 0;
  form.querySelector("#prev").addEventListener("click", () => { state.index = Math.max(0, state.index - 1); state.full = { left: false, right: false }; render(); });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!draft.choice) return;
    save(pair.id, { choice: draft.choice, note: draft.note.trim(), at: new Date().toISOString() });
    if (state.index < PAIRS.length - 1) state.index++;
    state.full = { left: false, right: false };
    render();
    window.scrollTo({ top: 0 });
  });
  main.replaceChildren(briefEl, sites, form);
}

function save(pairId, vote) {
  state.votes[pairId] = vote;
  renderChips();
  if (!ref) return;
  const body = { votes: { ...state.votes } };
  writing = writing.then(() => ref.set(body)).then(
    () => status("Saved."),
    (e) => status(e && e.code === "permission_denied"
      ? "You can view this page but not rate. Ask the owner for access that lets you interact."
      : "Couldn't save that vote. Check your connection; it will save with your next vote."),
  );
}

async function connect() {
  status("Connecting…");
  const [dbNs, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
  if (!dbNs || !user) {
    status("Sign in to claude.ai to save ratings. You can still look through the pairs.");
    return;
  }
  uid = await user.id();
  if (!uid) { status("Sign in to claude.ai to save ratings."); return; }
  db = dbNs;
  ref = db.doc("votes/" + uid);
  const timer = setTimeout(() => status("Your earlier ratings can't be reached yet. New votes still save."), 10000);
  let first = true;
  ref.onSnapshot((snap) => {
    if (!snap.fromCache) { clearTimeout(timer); status(""); }
    if (first && snap.exists) {
      state.votes = { ...(snap.data().votes || {}) };
      const next = PAIRS.findIndex((p) => !state.votes[p.id]);
      state.index = next === -1 ? 0 : next;
      first = false;
      render();
    } else if (first) { first = false; render(); }
  }, () => { clearTimeout(timer); status("Ratings storage stopped responding. Reload the page to keep rating."); });
  render();
}

render();
connect();
</script>
